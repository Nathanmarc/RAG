groups:
  - name: rag_alerts
    rules:
      - alert: HighQueryLatency
        expr: histogram_quantile(0.95, rate(rag_query_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High RAG query latency"
      - alert: HighErrorRate
        expr: rate(rag_queries_total[5m]) / rate(rag_queries_total[5m] offset 5m) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate in RAG queries"